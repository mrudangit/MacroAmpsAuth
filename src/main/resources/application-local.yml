# Developer profile: plain HTTP, Swagger UI on, DEBUG logging, UserInfo endpoint on localhost.
# Activate with --spring.profiles.active=local. Never use this profile in production.
amps:
  auth:
    userinfo:
      # Point this at a real identity provider, or at the stub described in the README ("Run locally").
      url: http://localhost:9999/userinfo
      enabled-groups: [amps-users]
# Swagger UI at http://localhost:8080/swagger-ui.html (OpenAPI document at /v3/api-docs).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
logging:
  level:
    # The key below is the service's package root, filled in by Maven resource filtering
    # from the base.package property in pom.xml (the built file contains the real name).
    "@base.package@": DEBUG
