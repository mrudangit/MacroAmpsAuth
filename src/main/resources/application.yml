server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    threads:
      max: 200
    connection-timeout: 5s
  # Production: terminate TLS here (AMPS verifies the certificate via its CAKey option).
  # ssl:
  #   bundle: amps-auth          # define under spring.ssl.bundle.pem or .jks
  #   client-auth: none          # set to "need" to require the AMPS client certificate (mTLS)

amps:
  auth:
    # AMPS puts the logon password (the OAuth2 access token) in this header:
    #   <HTTPHeader>X-AMPS-Password: {{AMPS_PASSWORD}}</HTTPHeader>
    password-header: X-AMPS-Password
    userinfo:
      url: https://login.example.com/oauth2/userinfo
      principal-claim: sub                  # must equal the username AMPS put in the path (case-insensitive)
      groups-claim: csgroups                # array of group names in the UserInfo response
      enabled-groups: []                    # e.g. [AMPS_PROD_USERS]; empty = every user with a valid token may log on
      connect-timeout: 1000ms
      read-timeout: 2000ms
      health-indicator-enabled: true
  permissions:
    template: classpath:amps/permissions-logon-only.json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      discovery:
        enabled: false                     # no /actuator index page: only the routes listed in the README
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Swagger UI / OpenAPI: off in production (no extra routes). Turn both on for manual testing, as the
# local profile does; then /swagger-ui.html and /v3/api-docs exist.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  paths-to-match: /amps/**

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] corr=%X{ampsCorrelationId:-} %logger{36} - %msg%n"
